services:
  postgres:
    image: 'postgres:16-alpine'
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=${DB_NAME:-tgbot}'
      - 'POSTGRES_USER=${DB_USER:-tgbot}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:?нужно задать DB_PASSWORD}'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-tgbot} -d ${DB_NAME:-tgbot}']
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    image: '${BOT_IMAGE:-ghcr.io/zagvladimir88/tgbot-by:latest}'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - 'DB_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-tgbot}'
      - 'DB_USER=${DB_USER:-tgbot}'
      - 'DB_PASSWORD=${DB_PASSWORD}'
      - 'BOT_TELEGRAM_TOKEN=${BOT_TELEGRAM_TOKEN}'
      - 'BOT_IMAGE_API_KEY=${BOT_IMAGE_API_KEY:-}'
      - 'BOT_IMAGE_CX=${BOT_IMAGE_CX:-}'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/actuator/health | grep -q UP']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres-data:
