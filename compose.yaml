services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=tgbot'
      - 'POSTGRES_USER=tgbot'
      - 'POSTGRES_PASSWORD=tgbot'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tgbot -d tgbot']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
