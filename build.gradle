plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.spotless)
}

group = 'ru.zagvladimir'
version = '0.0.1-SNAPSHOT'
description = 'Telegram bot: weather, NBRB rates, image search, keyboard layout'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.cache
    implementation libs.spring.boot.starter.data.jdbc
    implementation libs.spring.boot.starter.flyway
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.webmvc
    implementation libs.telegrambots.longpolling
    implementation libs.telegrambots.client
    implementation libs.flyway.database.postgresql
    implementation libs.spring.modulith.observability.api
    implementation libs.spring.modulith.starter.core
    implementation libs.spring.modulith.starter.jdbc

    developmentOnly libs.spring.boot.docker.compose

    runtimeOnly libs.postgresql
    runtimeOnly libs.spring.modulith.actuator
    runtimeOnly libs.spring.modulith.observability.core
    runtimeOnly libs.spring.modulith.runtime

    annotationProcessor libs.spring.boot.configuration.processor

    testImplementation libs.spring.boot.starter.actuator.test
    testImplementation libs.spring.boot.starter.cache.test
    testImplementation libs.spring.boot.starter.data.jdbc.test
    testImplementation libs.spring.boot.starter.flyway.test
    testImplementation libs.spring.boot.starter.validation.test
    testImplementation libs.spring.boot.starter.webmvc.test
    testImplementation libs.spring.boot.testcontainers
    testImplementation libs.spring.modulith.starter.test
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.postgresql

    testRuntimeOnly libs.junit.platform.launcher
}

dependencyManagement {
    imports {
        mavenBom libs.spring.modulith.bom.get().toString()
    }
}

spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat(libs.versions.palantir.java.format.get())
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'misc', {
        target '*.gradle', '*.md', '*.yaml', '*.yml', 'gradle/*.toml', '.gitignore', '.editorconfig'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}
